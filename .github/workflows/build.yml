name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | $SDKM --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk AppNEW.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppNEW-apk
          path: AppNEW.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AppNEW (ล่าสุด)
          make_latest: true
          files: AppNEW.apk
